[project]
name = "omai"
version = "0.1.0"
description = "oh-my-ai: install, log in, update and equip coding-agent harnesses in one go"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "packaging>=26",
    "textual>=8.2",
    "tomlkit>=0.15",
    "typer>=0.27",
]

[project.scripts]
omai = "omai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omai"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: real harnesses and network (opt-in)"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
